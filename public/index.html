<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0A0F0C">
  <meta name="description" content="Pickle X Matcher — smart open-play queue and court matchmaking for pickleball.">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="PX Matcher">
  <title>Pickle X Matcher</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icon.svg">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="topbar">
    <div class="brand">
      <svg class="logo" viewBox="0 0 512 512" aria-hidden="true">
        <circle cx="256" cy="256" r="240" fill="var(--accent)"/>
        <path d="M180 180l152 152M332 180L180 332" stroke="var(--accent-ink)" stroke-width="56" stroke-linecap="round"/>
      </svg>
      <span>Pickle <span class="x">X</span> Matcher</span>
      <span id="sync" class="sync" role="img" hidden></span>
    </div>
    <button id="undo" class="btn ghost sm" data-act="undo" hidden>
      <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 14 4 9l5-5"/><path d="M4 9h10.5a5.5 5.5 0 0 1 0 11H11"/></svg>
      Undo
    </button>
  </header>

  <main id="view" aria-live="polite"></main>

  <nav class="tabbar" aria-label="Main">
    <button data-act="tab" data-tab="live">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="M3 12h18M12 4v16"/></svg>
      Courts
    </button>
    <button data-act="tab" data-tab="players">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="9" cy="8" r="4"/><path d="M2 21v-1a6 6 0 0 1 6-6h2a6 6 0 0 1 6 6v1"/><path d="M16 4a4 4 0 0 1 0 8M22 21v-1a6 6 0 0 0-4-5.6"/></svg>
      Players
    </button>
    <button data-act="tab" data-tab="stats">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/></svg>
      Stats
    </button>
    <button data-act="tab" data-tab="settings">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 6h10M18 6h2M4 12h4M12 12h8M4 18h12M20 18h0"/><circle cx="16" cy="6" r="2"/><circle cx="10" cy="12" r="2"/><circle cx="18" cy="18" r="2"/></svg>
      Settings
    </button>
  </nav>

  <div id="sheet-root"></div>
  <div id="toast" role="status"></div>
  <input type="file" id="import-file" accept="application/json,.json" hidden>

  <!-- config.js and vendor/supabase.js are generated by `npm run build` (see scripts/build.mjs).
       If they're missing, the app runs in offline, device-only mode. -->
  <script src="config.js"></script>
  <script src="vendor/supabase.js"></script>
  <script src="vendor/qrcode.js"></script>
  <script src="eta.js"></script>
  <script src="cloud.js"></script>
  <script src="app.js"></script>
</body>
</html>
